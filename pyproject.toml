[project]
name = "clipfarm"
version = "0.1.0"
description = "Find fast-rising YouTube videos and turn them into vertical reaction clips with an animated character and ElevenLabs voice."
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2025.1.1",
    "requests>=2.31",
    "pillow>=10.0",
    "numpy>=1.26",
    "anthropic>=0.60",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipfarm = "clipfarm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["clipfarm"]

[tool.setuptools.package-data]
clipfarm = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
